<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Log in — KLAS Recruitment</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/klas.css">
<style>
.klx,.br{display:contents}.br[hidden]{display:none}
body{margin:0}
.kl-nav{display:inline-flex;align-items:center;min-height:48px;padding:0 12px;border-radius:8px;font:600 14px/20px Poppins,Arial,sans-serif;text-decoration:none;color:#B8BEC8}
.kl-nav:hover{color:#F7F8FA;background:#1C1C1C}
.kl-nav.on{color:#F7F8FA;background:#1C1C1C;box-shadow:inset 0 -2px 0 #39A2D6}
.kl-nav:focus-visible{outline:2px solid #7DD3FC;outline-offset:2px}
body{margin:0}
.kl-flink{color:#B8BEC8;text-decoration:none;font-size:14px;line-height:20px;display:inline-block;padding:6px 0}
.kl-flink:hover{color:#F7F8FA;text-decoration:underline}
.kl-flink:focus-visible{outline:2px solid #7DD3FC;outline-offset:2px}
body{margin:0;background:#111111}
a{color:#39A2D6}a:hover{color:#7DD3FC}
a.kl-btn{text-decoration:none}
.wrap{box-sizing:border-box;max-width:1248px;margin:0 auto;padding:0 24px}
.hero{background:radial-gradient(ellipse 40% 50% at 50% 35%, rgba(57,162,214,0.22), rgba(17,17,17,0) 70%), linear-gradient(#202226 1px, rgba(0,0,0,0) 1px) 0 0/64px 64px, linear-gradient(90deg, #202226 1px, rgba(0,0,0,0) 1px) 0 0/64px 64px, #111111}
@media (max-width:767px){.wrap{padding:0 16px}.panel{padding:24px !important}}
</style>
</head>
<body>
<div style="background: var(--background); color: var(--text); font-family: var(--font-sans); min-height: 100vh">
<header style="background: var(--background); border-bottom: 1px solid #262930; font-family: var(--font-sans); color: var(--text)">
<div style="box-sizing: border-box; max-width: 1248px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px">
<a href="index.html" aria-label="KLAS Recruitment home" style="display: flex; align-items: center; min-height: 48px">
<img src="assets/klas-logo-white.png" alt="KLAS Recruitment — Expert Recruitment Solutions" style="height: 44px; width: auto; display: block">
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 4px 8px; flex: 1 1 320px">
<a href="jobs.html" class="kl-nav">Find jobs</a>
<a href="employers.html" class="kl-nav">For employers</a>
<a href="candidates.html" class="kl-nav">For candidates</a>
</nav>
<div style="display: flex; gap: 12px; flex-wrap: wrap">
<a href="log-in.html" class="kl-btn kl-btn-secondary" style="text-decoration: none">Log in</a>
<a href="join.html" class="kl-btn kl-btn-primary" style="text-decoration: none">Sign up</a>
</div>
</div>
</header>
<main class="hero" style="padding: 80px 0 96px">
<div class="wrap" style="display: flex; justify-content: center">
<div class="panel" style="width: 100%; max-width: 480px; box-sizing: border-box; padding: 48px; border-radius: 16px; background: var(--surface); border: 1px solid #30343B; display: flex; flex-direction: column; gap: 24px">
<div>
<h1 style="margin: 0; font: 600 28px/36px var(--font-sans)">Welcome back</h1>
<p style="margin: 4px 0 0; color: var(--muted)">Log in to your KLAS account.</p>
</div>
<div class="klx" data-c="Button" data-p="{&quot;variant&quot;: &quot;secondary&quot;, &quot;block&quot;: true}">Continue with Google</div>
<div role="separator" aria-label="or" style="display: flex; align-items: center; gap: 16px; color: var(--muted); font-size: 14px">
<span style="flex: 1; height: 1px; background: #30343B"></span>or<span style="flex: 1; height: 1px; background: #30343B"></span>
</div>
<form style="display: flex; flex-direction: column; gap: 20px">
<div class="klx" data-c="TextField" data-p="{&quot;label&quot;: &quot;Email address&quot;, &quot;type&quot;: &quot;email&quot;, &quot;required&quot;: true, &quot;autoComplete&quot;: &quot;email&quot;, &quot;placeholder&quot;: &quot;name@example.com&quot;}"></div>
<div class="klx" data-c="TextField" data-p="{&quot;label&quot;: &quot;Password&quot;, &quot;type&quot;: &quot;password&quot;, &quot;required&quot;: true, &quot;autoComplete&quot;: &quot;current-password&quot;}"></div>
<a href="log-in.html" style="align-self: flex-end; font-size: 14px; font-weight: 600; min-height: 32px; display: inline-flex; align-items: center">Forgot password?</a>
<a href="candidate.html" class="kl-btn kl-btn-primary" style="width: 100%; box-sizing: border-box">Log in</a>
</form>
<p style="margin: 0; text-align: center; font-size: 14px; line-height: 20px; color: var(--muted)">New to KLAS? <a href="join.html">Sign up</a></p></div>
</div>
</main>
</div>
<script src="assets/react.production.min.js"></script>
<script src="assets/react-dom.production.min.js"></script>
<script src="assets/klas.js"></script>
<script src="assets/mount.js"></script>

</body>
</html>
